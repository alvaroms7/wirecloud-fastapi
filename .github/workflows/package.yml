name: Python package

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install package builder
        run: python -m pip install --upgrade build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel installation
        run: |
          python -m pip install --no-deps --target /tmp/wirecloud-wheel-check dist/*.whl
          PYTHONPATH=/tmp/wirecloud-wheel-check python -c "import wirecloud"

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: wirecloud-wheel
          path: dist/*.whl
          if-no-files-found: error

  attach_to_release:
    name: Attach wheel to release
    if: github.event_name == 'release'
    needs: build_wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: wirecloud-wheel
          path: dist

      - name: Upload wheel to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber
